<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediaVault Saver</title>
  <style>
    body {
      min-width: 280px;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: #f8fafc;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(135deg,#6366f1,#a855f7);
      color: #fff;
    }
    .secondary {
      background: #1e293b;
      color: #e2e8f0;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="title">MediaVault Saver</div>
  <label for="backendUrl">Backend URL</label>
  <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
  <div class="row">
    <button id="save" class="primary">Save current page</button>
    <button id="reset" class="secondary">Reset</button>
  </div>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
